worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Production-ready WebSocket Proxy Configuration
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Listen on 443 (HTTPS)
        listen       443 ssl;
        server_name  localhost;

        # Self-signed certificate paths (Update these paths with real certs for production)
        ssl_certificate      cert.pem;
        ssl_certificate_key  cert.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # Root static frontend serving
        location / {
            # Update this root to the absolute path of your frontend directory
            root   ../frontend;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # Secure WebSocket reverse proxy to FastAPI backend
        location /ws {
            proxy_pass http://127.0.0.1:8001/ws;
            
            # Critical headers for WebSocket protocol upgrade
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Security and identity pass-through
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Prevent Nginx from terminating idle WSS connections early
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
        
        # HTTP API reverse proxy to FastAPI backend
        location /api/ {
            proxy_pass http://127.0.0.1:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirect port 80 traffic to 443
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
}
